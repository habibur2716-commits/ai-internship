[project]
name = "rag-api"
version = "0.1.0"
description = ""
packages = [{include = "rag_api", from = "src"}]
authors = [
    {name = "Habib-ur-Rehman",email = "habibhr112211@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "sqlmodel (>=0.0.42,<0.0.43)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pypdf (>=6.18.1,<7.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "youtube-transcript-api (>=1.2.4,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "langchain-google-genai (>=4.4.0,<5.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "google-genai (>=2.23.0,<3.0.0)",
    "pinecone (>=10.0.0,<11.0.0)",
]

[tool.poetry]
packages = [{include = "rag_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
